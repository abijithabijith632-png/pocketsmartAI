<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Recommendations</title><link rel="stylesheet" href="/static/styles.css"></head><body><header><a class="brand" href="/dashboard">PocketSmart</a><nav><a href="/home-planner">Home Planner</a><a href="/history">History</a></nav></header><main><h1>Your Personalized Budget Plan</h1><div id="result"></div><a href="/home-planner">Create another plan</a></main><script>let d=JSON.parse(sessionStorage.getItem('home-result')||'{}'),root=document.querySelector('#result');root.innerHTML='<p>Total Budget: ₹'+(d.total_budget??'')+'</p>';for(let c of d.budget_breakdown||[]){let a=document.createElement('article');a.innerHTML='<h2>'+c.category+'</h2>';for(let i of c.items||[]){let p=document.createElement('p');p.textContent=[i.name,i.description,'₹'+i.estimated_price,'Qty '+i.quantity].filter(Boolean).join(' · ');a.append(p)}root.append(a)}</script></body></html>
