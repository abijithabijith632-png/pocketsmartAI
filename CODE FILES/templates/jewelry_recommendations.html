<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewelry Recommendations</title><link rel="stylesheet" href="/static/styles.css"></head><body><header><a class="brand" href="/dashboard">PocketSmart</a><nav><a href="/jewelry-planner">Jewelry Planner</a><a href="/history">History</a></nav></header><main><h1>Your Personalized Jewelry Recommendations</h1><div id="result"></div><a href="/jewelry-planner">Create another plan</a></main><script>let d=JSON.parse(sessionStorage.getItem('jewelry-result')||'{}'),root=document.querySelector('#result');root.innerHTML='<p>Total Budget: ₹'+(d.total_budget??'')+'</p>';for(let i of d.jewelry_recommendations||[]){let a=document.createElement('article');a.textContent=[i.item_type,i.description,i.style,'₹'+i.estimated_price].filter(Boolean).join(' · ');root.append(a)}for(let t of d.styling_tips||[]){let p=document.createElement('p');p.textContent=t;root.append(p)}</script></body></html>
