<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Party Recommendations</title><link rel="stylesheet" href="/static/styles.css"></head><body><header><a class="brand" href="/dashboard">PocketSmart</a><nav><a href="/party-planner">Party Planner</a><a href="/history">History</a></nav></header><main><h1>Your Party Budget Plan</h1><div id="result"></div><a href="/party-planner">Plan another event</a></main><script>let d=JSON.parse(sessionStorage.getItem('party-result')||'{}'),root=document.querySelector('#result');root.innerHTML='<p>Total Budget: ₹'+(d.total_budget??'')+'</p>';for(let c of d.budget_breakdown||[]){let a=document.createElement('article');a.innerHTML='<h2>'+c.category+'</h2>';for(let i of c.items||[]){let p=document.createElement('p');p.textContent=[i.name,i.description,'₹'+i.estimated_price].filter(Boolean).join(' · ');a.append(p)}root.append(a)}for(let v of d.venue_suggestions||[]){let a=document.createElement('article');a.textContent=[v.name,v.type,v.estimated_cost].filter(Boolean).join(' · ');root.append(a)}</script></body></html>
