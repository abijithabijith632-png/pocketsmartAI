<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewelry Budget Planner</title><link rel="stylesheet" href="/static/styles.css"></head><body><header><a class="brand" href="/dashboard">PocketSmart</a><nav><a href="/home-planner">Home Planner</a><a href="/party-planner">Party Planner</a><a href="/history">History</a></nav></header><main><h1>Jewelry Budget Planner</h1><p>Get personalized jewelry recommendations for your occasion.</p><form id="planner" class="form-grid"><label>Total Budget (₹)<input name="total_budget" type="number" min="0" required></label><label>Occasion<input name="occasion" required></label><label class="wide">Style Preferences<textarea name="preferences"></textarea></label><label class="wide">Upload Outfit Image<input name="image" type="file" accept="image/*"></label><p id="reuse-image-notice" class="history-image wide" hidden></p><button class="wide">Get Recommendations</button></form><p id="error" class="error"></p></main><script>document.querySelector('#planner').addEventListener('submit',async e=>{e.preventDefault();let r=await fetch('/generate-jewelry',{method:'POST',body:new FormData(e.target)}),v=await r.json();if(!r.ok){document.querySelector('#error').textContent=v.detail||'Unable to generate recommendations';return}sessionStorage.setItem('jewelry-result',JSON.stringify(v));location.href='/jewelry-recommendations';});
async function restorePreviousSearch(){const id=new URLSearchParams(location.search).get('reuse');if(!id)return;const note=document.querySelector('#error');try{const response=await fetch('/recommendations-details?recommendation_id='+encodeURIComponent(id),{credentials:'include'});if(!response.ok)throw new Error('Could not load this saved search.');const record=await response.json(),data=record.input||{};for(const key of ['total_budget','occasion','preferences']){const field=document.querySelector(`[name="${key}"]`);if(field&&data[key]!==undefined&&data[key]!==null)field.value=data[key]}if(data.image){const imageNote=document.querySelector('#reuse-image-notice');imageNote.hidden=false;imageNote.textContent=`Previous outfit image: ${data.image}. Please select the image again to include it.`}}catch(error){note.textContent=error.message}}
restorePreviousSearch();
</script></body></html>
