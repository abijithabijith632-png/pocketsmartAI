<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Party Budget Planner</title><link rel="stylesheet" href="/static/styles.css"></head><body><header><a class="brand" href="/dashboard">PocketSmart</a><nav><a href="/home-planner">Home Planner</a><a href="/jewelry-planner">Jewelry Planner</a><a href="/history">History</a></nav></header><main><h1>Party Budget Planner</h1><p>Plan your perfect event with AI-powered budget recommendations.</p><form id="planner" class="form-grid"><label>Total Budget (₹)<input name="total_budget" type="number" min="0" required></label><label>Number of Guests<input name="num_guests" type="number" min="1" required></label><label>Party Type<select name="party_type"><option>Birthday</option><option>Corporate</option><option>Wedding</option></select></label><label>Venue Type<input name="venue_type"></label><fieldset class="wide"><legend>Party Needs</legend><label><input name="needs_catering" type="checkbox" checked>Catering</label><label><input name="needs_decoration" type="checkbox" checked>Decoration</label><label><input name="needs_entertainment" type="checkbox" checked>Entertainment</label></fieldset><label class="wide">Additional Requirements<textarea name="additional_requirements"></textarea></label><button class="wide">Generate Budget Plan</button></form><p id="error" class="error"></p></main><script>document.querySelector('#planner').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),d={total_budget:Number(f.get('total_budget')),num_guests:Number(f.get('num_guests')),party_type:f.get('party_type'),venue_type:f.get('venue_type')||null,needs_catering:f.has('needs_catering'),needs_decoration:f.has('needs_decoration'),needs_entertainment:f.has('needs_entertainment'),additional_requirements:f.get('additional_requirements')};let r=await fetch('/generate-party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),v=await r.json();if(!r.ok){document.querySelector('#error').textContent=v.detail||'Unable to generate recommendations';return}sessionStorage.setItem('party-result',JSON.stringify(v));location.href='/party-recommendations';});
async function restorePreviousSearch(){const id=new URLSearchParams(location.search).get('reuse');if(!id)return;const note=document.querySelector('#error');try{const response=await fetch('/recommendations-details?recommendation_id='+encodeURIComponent(id),{credentials:'include'});if(!response.ok)throw new Error('Could not load this saved search.');const record=await response.json(),data=record.input||{};for(const key of ['total_budget','num_guests','party_type','venue_type','additional_requirements']){const field=document.querySelector(`[name="${key}"]`);if(field&&data[key]!==undefined&&data[key]!==null)field.value=data[key]}for(const key of ['needs_catering','needs_decoration','needs_entertainment']){const field=document.querySelector(`[name="${key}"]`);if(field)field.checked=Boolean(data[key])}}catch(error){note.textContent=error.message}}
restorePreviousSearch();
</script></body></html>
