<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Interior Budget Planner</title><link rel="stylesheet" href="/static/styles.css"></head><body><header><a class="brand" href="/dashboard">PocketSmart</a><nav><a href="/party-planner">Party Planner</a><a href="/jewelry-planner">Jewelry Planner</a><a href="/history">History</a></nav></header><main><h1>Home Interior Budget Planner</h1><p>Create a customized budget plan for your dream home interior.</p><form id="planner" class="form-grid"><label>Total Budget (₹)<input name="total_budget" type="number" min="0" step="0.01" required></label><label>Number of Lights<input name="num_lights" type="number" min="0" value="0"></label><label>Number of Ceiling Fans<input name="num_fans" type="number" min="0" value="0"></label><label>Furniture Pieces<input name="num_furniture" type="number" min="0" value="0"></label><label>Dining Tables<input name="num_dining_tables" type="number" min="0" value="0"></label><fieldset><legend>Rooms to Include</legend><label><input name="has_living_room" type="checkbox"> Living Room</label><label><input name="has_kitchen" type="checkbox"> Kitchen</label><label><input name="has_bedroom" type="checkbox"> Bedroom</label></fieldset><label class="wide">Additional Requirements<textarea name="additional_requirements"></textarea></label><button id="generate-button" class="wide">Generate Recommendations</button></form><p id="error" class="error"></p></main><script>let submitting=false;document.querySelector('#planner').addEventListener('submit',async e=>{e.preventDefault();if(submitting)return;submitting=true;let button=document.querySelector('#generate-button'),label=button.textContent;button.disabled=true;button.textContent='Generating...';let f=new FormData(e.target),d={};for(let k of ['total_budget','num_lights','num_fans','num_furniture','num_dining_tables'])d[k]=Number(f.get(k)||0);for(let k of ['has_living_room','has_kitchen','has_bedroom'])d[k]=f.has(k);d.additional_requirements=f.get('additional_requirements');let error=document.querySelector('#error');error.textContent='';try{let r=await fetch('/generate-home',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),v=await r.json();if(!r.ok){error.textContent=v.detail||'Unable to generate recommendations';return}sessionStorage.setItem('home-result',JSON.stringify(v));location.href='/home-recommendations'}catch(err){error.textContent=`Unable to complete the request: ${err.message}`}finally{submitting=false;button.disabled=false;button.textContent=label}});
async function restorePreviousSearch(){const id=new URLSearchParams(location.search).get('reuse');if(!id)return;const note=document.querySelector('#error');try{const response=await fetch('/recommendations-details?recommendation_id='+encodeURIComponent(id),{credentials:'include'});if(!response.ok)throw new Error('Could not load this saved search.');const record=await response.json(),data=record.input||{};for(const key of ['total_budget','num_lights','num_fans','num_furniture','num_dining_tables','additional_requirements']){const field=document.querySelector(`[name="${key}"]`);if(field&&data[key]!==undefined&&data[key]!==null)field.value=data[key]}for(const key of ['has_living_room','has_kitchen','has_bedroom']){const field=document.querySelector(`[name="${key}"]`);if(field)field.checked=Boolean(data[key])}}catch(error){note.textContent=error.message}}
restorePreviousSearch();
</script></body></html>
